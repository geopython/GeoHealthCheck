[project]
name = "GeoHealthCheck"
version = "0.9.0"
description = "Monitor uptime and availability of OGC web services and REST APIs"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Just van den Broecke", email = "just@justobjects.nl" },
    { name = "Tom Kralidis", email = "tomkralidis@gmail.com" },
]
# Faithful 1:1 port of pixi.toml: these are the former [pypi-dependencies].
# Note: `invoke` was also listed here in pixi.toml but is a conda dependency
# (see [tool.pixi.dependencies]); the redundant pypi entry is dropped.
# A more efficient hybrid model (native/geo packages from conda-forge,
# requires-python, pip-fallback policy) is deferred to a follow-up.
dependencies = [
    "astroid==2.15.8",
    "Jinja2==3.0.3",
    "markupsafe==2.0.1",
    "Flask==1.1.1",
    "Flask-Babel==0.12.2",
    "Flask-Login==0.4.1",
    "Flask-Migrate==2.5.2",
    "Flask-Script==2.0.6",
    "SQLAlchemy==1.3.8",
    "Flask-SQLAlchemy==2.4.0",
    "itsdangerous==1.1.0",
    "pyproj>=2.6.1",
    "OWSLib==0.20.0",
    "jsonschema==4.26.0",
    "openapi-spec-validator==0.9.0",
    "psycopg2-binary",
    "Sphinx==5.3.0",
    "sphinx-rtd-theme==1.3.0",
    "sphinx-autoapi",
    "requests>=2.23.0",
    "WTForms==2.2.1",
    "APScheduler==3.11.2",
    "Werkzeug==0.16.1",
    "passlib==1.7.1",
    "tzlocal",
]

[project.urls]
Homepage = "https://geohealthcheck.org"
Documentation = "https://docs.geohealthcheck.org"
Repository = "https://github.com/geopython/GeoHealthCheck"

# --- Pixi workspace configuration (replaces pixi.toml) ---
# No [build-system] on purpose: GeoHealthCheck runs from source
# (via `invoke setup`), so pixi manages the environment but does not
# install GHC itself as a package.

[tool.pixi.workspace]
name = "ghc"
channels = ["conda-forge"]
platforms = ["osx-arm64"]

# Conda-forge dependencies (former pixi.toml [dependencies]).
[tool.pixi.dependencies]
invoke = "==3.0.3"
lxml = ">=4.8.0,<=4.9.4"

[tool.pixi.tasks]
# App bootstrap (config, JS assets, i18n, local docs, DB). Wraps `invoke setup`
# so it runs in the activated env without `pixi shell`. In the default feature,
# so it works for both dev and prod (README runs `invoke setup` for prod too).
setup = "invoke setup"

[tool.pixi.feature.dev.dependencies]
flake8 = "==5.0.4"
pytest = "*"
pytest-md = "*"
pytest-asyncio = "*"

[tool.pixi.feature.dev.tasks]
test = "pytest --md=report.md"

[tool.pixi.environments]
# both dev and prod share exactly the same versions for shared dependencies
dev = { features = ["dev"], solve-group = "prod-group" }
prod = { features = [], solve-group = "prod-group" }

# pytest needs GeoHealthCheck/ on the import path: the test modules import
# top-level packages (models, init, ...) that live there. This mirrors the
# sys.path setup in tests/run_tests.py (the entry point used by CI).
# Note: the `test` task still requires the app to be bootstrapped first
# (`invoke setup` creates instance/config_site.py and the DB), same as CI.
[tool.pytest.ini_options]
pythonpath = ["GeoHealthCheck"]
testpaths = ["tests"]
