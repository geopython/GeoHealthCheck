[workspace]
authors = ["Just van den Broecke <just@justobjects.nl>"]
channels = ["conda-forge"]
name = "ghc"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]

[dependencies]
invoke = "==3.0.3"
lxml = ">=4.8.0,<=4.9.4"

[pypi-dependencies]
astroid = "==2.15.8"
Jinja2 = "==3.0.3"
markupsafe = "==2.0.1"
Flask = "==1.1.1"
Flask-Babel = "==0.12.2"
Flask-Login = "==0.4.1"
Flask-Migrate = "==2.5.2"
Flask-Script = "==2.0.6"
SQLAlchemy = "==1.3.8"
Flask-SQLAlchemy = "==2.4.0"
itsdangerous = "==1.1.0"
pyproj = ">=2.6.1"
OWSLib = "==0.20.0"
jsonschema = "==4.26.0"
openapi-spec-validator = "==0.9.0"
psycopg2-binary = "*"
Sphinx = "==5.3.0"
sphinx-rtd-theme = "==1.3.0"
sphinx-autoapi = "*"
requests = ">=2.23.0"
WTForms = "==2.2.1"
APScheduler = "==3.11.2"
Werkzeug = "==0.16.1"
passlib = "==1.7.1"
tzlocal = "*"
invoke = "==3.0.3"

[feature.dev.dependencies]
flake8 = "==5.0.4"
pytest = "*"
pytest-md = "*"
pytest-asyncio = "*"

[feature.dev.tasks]
test = "pytest --md=report.md"

[environments]
# both default and prod will have exactly the same dependency versions when they share a dependency
dev = {features = ["dev"], solve-group = "prod-group"}
prod = {features = [], solve-group = "prod-group"}
